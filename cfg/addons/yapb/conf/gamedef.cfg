//
// Game definitions for the bot: sound classification templates and weapon
// definitions. Parsed by the universal config parser, so the format is
// sections/keys/values (see comments throughout this file for details).
//
// NOTE: All changes to this file takes effect only on game restart.
//

//
// Sound templates. Every block name is a sound sample prefix (relatively to
// the "sound/" directory); the first matching prefix wins, so put more
// specific entries before generic ones.
//
// Values:
//    flags    - noise classification (one or more, comma separated):
//                  HitFall, Pickup, Zoom, Ammo, Hostage, Broke, Door,
//                  Defuse, SGDetonate, WeaponFire, Footstep, Explosion,
//                  Ricochet, Misc
//    radius   - base hear radius, in units (scaled by volume/attenuation)
//    duration - how long the sound stays in bot's memory, in seconds
//
// This section fully replaces the built-in defaults when present.
//
HearableSounds {
  // c4 / bomb
  "weapons/c4_d" {
    flags = Defuse
    radius = 2048.0
    duration = 3.00
  }
  "weapons/c4_beep" {
    flags = Defuse
    radius = 1536.0
    duration = 2.00
  }
  "weapons/c4_explode" {
    flags = Defuse
    radius = 4096.0
    duration = 4.00
  }
  "weapons/c4_p" {
    flags = Defuse
    radius = 1024.0
    duration = 1.50
  }

  // smoke grenade
  "weapons/sg_explode" {
    flags = SGDetonate
    radius = 1024.0
    duration = 2.00
  }

  // grenade explosions
  "weapons/explode" {
    flags = Explosion
    radius = 2048.0
    duration = 3.00
  }
  "weapons/flashbang-" {
    flags = Explosion
    radius = 2048.0
    duration = 2.00
  }

  // ricochet / bullet impacts
  "weapons/ric" {
    flags = Ricochet
    radius = 1024.0
    duration = 1.50
  }
  "weapons/bullet_hit" {
    flags = Ricochet
    radius = 1024.0
    duration = 1.50
  }

  // zoom / weapon gadget
  "weapons/zoo" {
    flags = Zoom
    radius = 512.0
    duration = 0.50
  }

  // quiet weapon sounds: knife swings, reloads, grenade bounces and pin pulls
  // hearable, but must not be mistaken for actual gunfire by the catch-all below
  "weapons/knife_" {
    flags = Misc
    radius = 512.0
    duration = 0.50
  }
  "weapons/clip" {
    flags = Misc
    radius = 512.0
    duration = 0.75
  }
  "weapons/slide" {
    flags = Misc
    radius = 512.0
    duration = 0.75
  }
  "weapons/bolt" {
    flags = Misc
    radius = 512.0
    duration = 0.75
  }
  "weapons/reload" {
    flags = Misc
    radius = 512.0
    duration = 0.75
  }
  "weapons/grenade_hit" {
    flags = Misc
    radius = 512.0
    duration = 0.50
  }
  "weapons/g_bounce" {
    flags = Misc
    radius = 512.0
    duration = 0.50
  }
  "weapons/pinpull" {
    flags = Misc
    radius = 512.0
    duration = 0.50
  }

  // weapon fire catch-all (after all other weapons/ overrides)
  "weapons/" {
    flags = WeaponFire
    radius = 2048.0
    duration = 2.00
  }

  // player hit / fall
  "player/bhit" {
    flags = HitFall
    radius = 768.0
    duration = 2.00
  }
  "player/head" {
    flags = HitFall
    radius = 768.0
    duration = 2.00
  }

  // footsteps
  "player/pl_" {
    flags = Footstep
    radius = 1280.0
    duration = 1.50
  }

  // item pickups
  "items/gunpick" {
    flags = Pickup
    radius = 768.0
    duration = 1.50
  }
  "items/9mm" {
    flags = Ammo
    radius = 512.0
    duration = 1.00
  }

  // world interaction
  "hostage/hos" {
    flags = Hostage
    radius = 1024.0
    duration = 5.00
  }
  "doors/doorm" {
    flags = Door
    radius = 1024.0
    duration = 3.50
  }
  "debris/bust" {
    flags = Broke
    radius = 1024.0
    duration = 3.00
  }
}

//
// Weapon definitions. Every block name is a weapon id (see the list below),
// unknown ids are reported and ignored. Missing values are inherited from the
// built-in defaults, so partial overrides are allowed.
//
// Values:
//    name            - classname used to select the weapon
//    model           - p_ model name to separate cs weapons
//    alias           - buy-menu alias of the weapon, used by the weapon restrictions
//    FullName        - full weapon name for display (ie. "HK USP .45 Tactical")
//    price           - price when buying
//    MinPrimaryAmmo  - minimum primary ammo to buy
//    TeamStandard    - team availability on standard maps: none, terrorist, ct, both
//    TeamAS          - team availability on as_ maps
//    BuyGroup        - group in the buy menu (standard maps)
//    BuySelect       - item to select in the buy menu (standard maps)
//    BuySelectT      - item to select in the v1.6 buy menu (terrorists)
//    BuySelectCT     - item to select in the v1.6 buy menu (CTs)
//    PenetratePower  - wall penetration power
//    MaxClip         - max ammo in clip
//    type            - weapon class: melee, pistol, shotgun, zoomrifle, rifle, smg, sniper, heavy
//    PrimaryFireHold - hold down the primary fire button to use (yes/no)
//
// NOTE: the order of weapons inside this section doesn't matter, entries are
// matched by id. Do not add new weapons here, they must exist in the bot's
// weapon table.
//
