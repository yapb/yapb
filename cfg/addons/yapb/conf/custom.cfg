//
// @package: YaPB
// @version: 4.8
// @author: YaPB Team
// @filename: custom.cfg
//
// Custom configuration file, allow to change some hardcoded stuff in bot code.
//
// NOTE: All changes to this file takes effect only on server restart.
// Keys may live either inside their section (current layout) or at the
// root level (legacy layout, still accepted).
//

//
// Network availability probing. The bot attempts a plain tcp connect to
// this host to decide whether networking features (graph download/upload)
// are usable at all.
//
Connectivity {
  //
  // Specifies the hostname the bot will attempt to connect to for checking network
  // availability and enabling graph download/upload features. An optional ":port"
  // suffix is supported (default 80), e.g. "google.com:443".
  //
  CheckConnectivityHost = google.com:443
}

//
// Graph database endpoints behind the @aliases of yb_graph_url /
// yb_graph_url_upload. Change them here to relocate the database
// without rebuilding the bot.
//
GraphDatabase {
  //
  // Download base behind "@github" (cdn raw over https).
  //
  GraphGithubDownload = https://raw.githubusercontent.com/yapb/graph/refs/heads/master

  //
  // Download base behind "@russia" (sourcecraft over https).
  //
  GraphRussiaDownload = https://sourcecraft.dev/api/file/yapb/graph

  //
  // Upload base behind "@workers" (cloudflare worker over https).
  //
  GraphWorkersUpload = https://graph-worker.yapb.workers.dev

  //
  // Upload base behind "@russia" (yandex worker copy over https).
  //
  GraphRussiaWorker = https://d5d5lttn6kg3uqou32ei.g4vq2kuy.apigw.yandexcloud.net

  //
  // Base behind "@http" (legacy plain http server).
  //
  GraphLegacyBase = http://yapb.jeefo.net

  //
  // Upload base used as a no-TLS fallback for "@workers" and "@russia".
  //
  GraphLegacyUpload = http://yapb.jeefo.net/upload
}

//
// Game integration bits: model and cvar names that differ across mods.
//
Game {
  //
  // Custom name for C4 model, for servers that replacing C4 model with it's own.
  // By default it's "c4.mdl" (the models/ path is omitted), so if you need to use
  // "models/mybomb/mybomb.mdl", you should specify "mybomb/mybomb.mdl".
  //
  C4ModelName = c4.mdl

  //
  // Custon cvar name for parachute handling, there are all the different plugins that
  // handles parachute (AMX Parachute, AMX Parachute Lite, etc..), you can specify needed
  // cvar here.
  //
  AMXParachuteCvar = sv_parachute
}

//
// Supported mods detection and integration.
//
Mods {
  //
  // For CSDM mods that add custom spawn points other than info_player_start and
  // In info_player_deathmatch, you can specify the class name of this spawn point.
  // So bot's will be able to join the game without default spawn entities.
  //
  CustomCSDMSpawnPoint = view_spawn

  //
  // Primary cvar for detection if CSDM mod is activated in game.
  //
  CSDMDetectCvar = csdm_active

  //
  // Primary cvar(s) to detect if bot is running on Zombie Mod.
  // You can provide multiple cvars, separated by comma. The mod is
  // considered active if any of these cvars does exist on server.
  //
  ZMDetectCvar = zp_delay,zp_on

  //
  // For Zombie Mod, the cvars that deals with time before any game mode starts.
  //
  ZMDelayCvar = zp_delay

  //
  // For Zombie Mod, determines the team on which infected players are on.
  // Valid values: T, CT.
  //
  ZMInfectedTeam = T
}

//
// Optional bot features and behavior constraints.
//
Features {
  //
  // This decides if fake features (like a fake time, fake SID (avatar), fakeping)
  // should be enabled whitin bot code. By default it's off. To enable it you're
  // should provide variable with: "i'm confident for what i'm doing" value.
  //
  EnableFakeBotFeatures = no

  //
  // Disables any writing activity to log files. Thus all errors and warnings just
  // sent to the server console. This replaces yb_logger_disable_logfile cvar.
  //
  DisableLogFile = no

  //
  // Disables enforcement of player spawn limits during bot creation and quota management,
  // allowing the use of custom spawn editors.
  //
  DisableSpawnControl = no

  //
  // Allows to control the bot's think rate (tick rate) with the yb_think_fps cvar. By
  // default the bot's tick rate is locked to the internal value, and yb_think_fps is ignored.
  //
  UnlockThinkFPS = no
}

//
// Support for map-restricting plugins (e.g. AMXX "Mode 2x2" by s1lent),
// which seal off parts of the map with wall entities when online is low.
//
ModeWalls {
  //
  // Classname of the wall entities the plugin spawns. Bots treat entities
  // with this classname and solid bbox as blockers for pathfinding.
  //
  ModeWallClassname = test_effect
}
