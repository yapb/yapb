//
// Configuration file contains weapon preferences for bots. Weapons are
// referenced by name (Knife, USP, Glock18, Deagle, P228, Elite, FiveSeven,
// M3, XM1014, MP5, TMP, P90, MAC10, UMP45, AK47, SG552, M4A1, Galil, Famas,
// AUG, Scout, AWP, G3SG1, SG550, M249, Shield), so you never need to know
// the internal weapon numbering.
//
// NOTE: All changes to this file takes effect only on server restart.
//

//
// Following are Tables which specify which Team is allowed
// to buy a weapon on a Map. You can also use it to allow/disallow
// Weapons for a Team or a Map/Gamemode (remember that some
// Weapons are team-specific and can't be bought by another team).
//
// Possible values:
//   banned     - disallow buying for any Team
//   terrorist  - Terrorist Team only (alias: t)
//   ct         - CT Team only
//   both       - can be bought by both Teams
//
// Only the weapons you list here are overridden; the rest keep their
// defaults from gamedef.cfg. These blocks override gamedef.cfg values.
//

// Standard Weapon Tab for CS & DE Maps
Standard {
  Knife = banned
  USP = terrorist
  Glock18 = banned
  Deagle = both
  P228 = banned
  Elite = terrorist
  FiveSeven = ct
  M3 = both
  XM1014 = both
  MP5 = both
  TMP = banned
  P90 = both
  MAC10 = banned
  UMP45 = banned
  AK47 = terrorist
  SG552 = terrorist
  M4A1 = ct
  Galil = terrorist
  Famas = ct
  AUG = ct
  Scout = both
  AWP = both
  G3SG1 = terrorist
  SG550 = ct
  M249 = both
