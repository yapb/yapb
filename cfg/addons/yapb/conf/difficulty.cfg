//
// @package: YaPB
// @version: 4.8
// @author: YaPB Team
// @filename: difficulty.cfg
//
// Configuration file contains difficulty definitions for bots difficulty
// selection. Every block is a difficulty level, missing values are inherited
// from the built-in defaults.
//
// Values:
//    reaction           - min,max reaction time (seconds) from when the bot first
//                         saw the enemy to when it can recognize it
//    HeadshotChance     - probability that the bot will aim at the head instead of
//                         body, if both body and head are visible
//    SeenThruWallChance - chance that the bot will attack the enemy if it believes
//                         that it is there and just saw it
//    HeardThruWallChance- chance that the bot will attack the enemy if it believes
//                         that it is there and just heard it
//    MaxRecoil          - maximum weapon recoil to compensate by pausing fire
//    AimError           - (x, y, z) offsets to add aim error to bot aiming
//
// NOTE: All changes to this file takes effect only on server restart.
//

Noob {
  reaction = 1.0, 1.4
  HeadshotChance = 20
  SeenThruWallChance = 10
  HeardThruWallChance = 10
  MaxRecoil = 34
  AimError = 12.0, 12.0, 20.0
}

