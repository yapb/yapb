//
// Configuration file contains chatter definitions for bots (bot voice lines).
//
// - RewritePath replaces the directory where chatter sounds are searched in.
// - Every block is a chatter event; block names must match the event names
//   known to the bot. Unknown events are reported and ignored.
// - Sounds are listed one per line (bare list items). Missing sound files
//   are reported to the console. Order is randomized by the bot itself.
//
// NOTE: All changes to this file takes effect only on server restart.
//

