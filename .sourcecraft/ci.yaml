on:
  push:
    - workflows: [build]
      filter:
        branches: [master, main, dev]
        paths: ["**", "!**.md"]
    - workflows: [release]
      filter:
        tags: ["**"]
  pull_request:
    - workflows: [build]
      filter:
        target_branches: [master, main, dev]
        paths: ["**", "!**.md"]

workflows:
  build:
    settings:
      max_cube_duration: 20m
    tasks:
      - name: amxx-include
        uses: amxx-include
      - name: linux-x86
        uses: cross-build
        env: { ARCH: linux-x86 }
      - name: linux-amd64
        uses: cross-build
        env: { ARCH: linux-amd64 }
      - name: linux-x86-nosimd
        uses: cross-build
        env: { ARCH: linux-x86-nosimd }
      - name: linux-arm64
        uses: cross-build
        env: { ARCH: linux-arm64 }
      - name: linux-riscv64
        uses: cross-build
        env: { ARCH: linux-riscv64 }
      - name: apple-amd64
        uses: cross-build
        env: { ARCH: apple-amd64 }
      - name: windows-x86-clang
        uses: cross-build
        env: { ARCH: windows-x86-clang }
      - name: windows-amd64
        uses: cross-build
        env: { ARCH: windows-amd64 }

  release:
    settings:
      max_cube_duration: 20m
    tasks:
      - name: release
        uses: make-release

tasks:
  - name: amxx-include
    cubes:
      - name: submodules
        script:
          - git submodule update --init --recursive
      - name: check
        script:
          - python3 tools/gen_amxx_inc.py --check

  - name: cross-build
    cubes:
      - name: submodules
        script:
          - git submodule update --init --recursive
      - name: zig
        env:
          ZIG_VERSION: "0.16.0"
        script:
          - |
            set -e
            ZIG_DIR="$HOME/.local/zig"
            mkdir -p "$ZIG_DIR"
            rm -rf "$ZIG_DIR"/*
            curl -fsSL --retry 3 -o /tmp/zig.tar.xz \
              "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
            tar -xJf /tmp/zig.tar.xz -C "$ZIG_DIR" --strip-components=1
            echo "PATH=$ZIG_DIR:$PATH" >> "$SOURCECRAFT_ENV"
            "$ZIG_DIR/zig" version
      - name: configure
        script:
          - cmake --preset "ci-$ARCH"
      - name: build
        script:
          - cmake --build --preset "ci-$ARCH"
      - name: check-dll-abi
        if: contains(env.ARCH, "windows-")
        script:
          - |
            set -e
            dll=$(find "build/ci-$ARCH" -maxdepth 1 -type f -name 'yapb*.dll' ! -name '*amxx*' | head -1)
            if [ -z "$dll" ]; then
              echo "No YAPB DLL found in build/ci-$ARCH"
              exit 1
            fi
            arch=i386
            if [[ "$ARCH" == *amd64* ]]; then
              arch=amd64
            fi
            echo "Checking DLL ABI: $dll ($arch)"
            python3 tools/check_dll.py "$dll" --arch "$arch"
      - name: check-abi
        if: env.ARCH == "linux-x86" || env.ARCH == "linux-x86-nosimd"
        script:
          - |
            set -e
            so=$(find "build/ci-$ARCH" -maxdepth 1 -type f -name 'yapb*.so' ! -name '*amxx*' | head -1)
            if [ -z "$so" ]; then
              echo "No YAPB shared library found in build/ci-$ARCH"
              exit 1
            fi
            echo "Checking ABI: $so (i386, max glibc 2.17)"
            python3 tools/check_abi.py "$so" --arch i386 --max-glibc 2.17
      - name: check-glibc
        if: contains(env.ARCH, "linux-") && env.ARCH != "linux-x86" && env.ARCH != "linux-x86-nosimd"
        script:
          - |
            set -e
            if ! command -v objdump >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils
              else
                apt-get update && apt-get install -y --no-install-recommends binutils
              fi
            fi
            so=$(find "build/ci-$ARCH" -maxdepth 1 -type f -name 'yapb*.so' ! -name '*amxx*' | head -1)
            if [ -z "$so" ]; then
              echo "No YAPB shared library found in build/ci-$ARCH"
              exit 1
            fi
            echo "Checking build/ci-$ARCH/$so"
            max=$(objdump -T "$so" | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
            echo "Max GLIBC: $max"
            if [ "$ARCH" = "linux-riscv64" ]; then limit=GLIBC_2.27; else limit=GLIBC_2.17; fi
            top=$(printf '%s\n%s\n' "$limit" "$max" | sort -Vu | tail -1)
            if [ "$top" != "$limit" ]; then
              echo "glibc baseline $max exceeds $limit"
              exit 1
            fi
      - name: collect
        script:
          - |
            set -e
            mkdir -p artifacts
            find "build/ci-$ARCH" -maxdepth 1 -type f \
              \( -name 'yapb*.so' -o -name 'yapb*.dll' -o -name 'yapb*.dylib' \) \
              -exec cp {} artifacts/ \;
            if ! find artifacts -type f -print -quit | grep -q .; then
              echo "No build artifacts found"
              exit 1
            fi
            ls -la artifacts
        artifacts:
          paths:
            - artifacts/*

  - name: make-release
    cubes:
      - name: submodules
        script:
          - git submodule update --init --recursive
      - name: dependencies
        script:
          - |
            set -e
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends osslsigncode
      - name: python
        script:
          - |
            set -e
            python3 -m pip install --user --upgrade requests
      - name: package
        script:
          - |
            set -e
            cmake --preset dist
            cmake --build --preset dist --target package
